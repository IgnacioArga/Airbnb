      <text x="600" y="150">Tipos y nulos</text>
      <text x="840" y="150">Hechos y dimensiones</text>
      <text x="1080" y="150">Dashboard</text>
    </g>
    <g font-size="34" fill="#14213D">
      <text x="240" y="131">→</text>
      <text x="480" y="131">→</text>
      <text x="720" y="131">→</text>
      <text x="960" y="131">→</text>
    </g>
